<html lang="ko">

<title>챗봇 닥터 수련</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 연수 게임 — 픽셀 수학 탐험대와 같은 집안, 차분한 남색과 따뜻한 주황
   IDEA: 챗봇 종합병원 수련 과정 — 차트, 검사 결과지, 면허증
   PICTURE: 환자 로봇 얼굴, 검사 타일, 재검사 전후, 면허증
   COLOUR and TYPE: 모눈 배경 #eef2f8, 남색 #1e2b4a, 주황 CTA #e2793b, 라이트 고정
   LAYOUT: 앱 아이콘 헤더 + 한 줄 진행 막대, 둥근 큰 카드, 아래 원형 이전 + 알약 다음 */
:root{color-scheme:light;--bg:#eef2f8;--card:#fff;--ink:#1e2b4a;--mut:#6b7891;--ln:#dfe5ef;--a:#2b3a67;--a2:#e8edf7;--a3:#cfd9ee;--c:#e2793b;--c2:#fdeee3;--o:#d9534f;--o2:#fdecec;--g:#2e9e6b;--g2:#e6f5ee;--y:#d9932a;--y2:#fff5e6}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip;background:var(--bg) linear-gradient(#e2e8f2 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#e2e8f2 1px,transparent 1px) 0 0/32px 32px;background-image:linear-gradient(#e2e8f2 1px,transparent 1px),linear-gradient(90deg,#e2e8f2 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:rgba(238,242,248,.92);backdrop-filter:blur(8px);padding:12px 16px 10px}

.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.meta{text-align:right;line-height:1.3}.meta #stl{font-size:13px;font-weight:700;color:#4a5878}.pts{font-size:13px;color:var(--mut);white-space:nowrap}.pts b{color:var(--c);font-size:16px;font-variant-numeric:tabular-nums}
.prog{max-width:760px;margin:10px auto 0;height:8px;border-radius:99px;background:#dde4ef;overflow:hidden}.prog i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width .4s}

.card{background:var(--card);border-radius:22px;padding:18px 18px;margin-bottom:12px;box-shadow:0 6px 24px rgba(30,43,74,.07),0 1px 2px rgba(30,43,74,.05)}

input,textarea,select{font:inherit;font-size:16px;width:100%;padding:11px 14px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}button:focus-visible{outline:2px solid var(--a);outline-offset:2px}

button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ln);box-shadow:none}

.choice button:disabled{opacity:.55}.choice button.ok:disabled,.choice button.no:disabled{opacity:1}.choice button.ok{background:var(--g2);border-color:var(--g);color:#1e7a52}

.big{font-size:48px;line-height:1;font-weight:800;color:var(--a);font-variant-numeric:tabular-nums}.big small{font-size:15px;color:var(--mut);font-weight:700}

@media(min-width:640px){.tiles.t5{grid-template-columns:repeat(5,minmax(0,1fr))}.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{min-height:0;padding:9px 10px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;color:var(--ink);font-weight:600;font-size:13px;text-align:left;display:flex;gap:7px;align-items:flex-start;line-height:1.35;box-shadow:none}
.tile .m{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--g);margin-top:1px}
.tile.x{border-color:#f1c0be;background:var(--o2)}.tile.x .m{background:var(--o)}
.tile[aria-pressed=true]{border-color:var(--a);box-shadow:0 0 0 2px var(--a3)}
.tile .qq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.det{margin-top:10px;padding:12px 14px;border-radius:14px;background:#f5f7fb;font-size:13px;border:1px dashed var(--a3)}
.det .row2{margin:3px 0}.det .k{color:var(--mut);display:inline-block;width:4.5em;font-weight:600}
.bad{color:var(--o);font-weight:800}.good{color:var(--g);font-weight:800}
.tok{display:inline-block;padding:1px 8px;margin:1px 3px 1px 0;border-radius:999px;background:var(--a2);color:var(--a);font-weight:700;font-size:12px}
.tok.u{background:var(--o2);color:var(--o);text-decoration:line-through}.tok.m{background:var(--a3);color:var(--ink)}.tok.s{background:#eceef2;color:#9aa1ad;text-decoration:line-through}
.cc{background:var(--y2);border-radius:14px;padding:11px 14px;font-weight:700;color:#7a4f0f;margin:10px 0 0;font-size:14px}
.stage{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:12px}.stage span{padding:3px 11px;border-radius:999px;background:#f1f4f9;color:var(--mut);font-weight:700}.stage span.on{background:var(--a);color:#fff}.stage span.done{background:var(--a2);color:#3b4a75}
.pt{display:flex;gap:14px;align-items:center;margin-top:8px}.pt h2{margin:0}
.timer{height:6px;border-radius:99px;background:#e6ebf3;overflow:hidden;margin:6px 0 10px}.timer i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width 1s linear}.timer.over i{background:#b5bcc8}
.fb{margin-top:10px;padding:12px 14px;border-radius:14px;font-size:14px}.fb.ok{background:var(--g2);color:#17603f}.fb.no{background:var(--o2);color:#8f2d2a}
.fb b{display:block;margin-bottom:2px}
.out{display:inline-block;padding:2px 11px;border-radius:999px;font-weight:800;font-size:13px}.out.cure{background:var(--g2);color:var(--g)}.out.better{background:var(--a2);color:var(--a)}.out.side{background:var(--o2);color:var(--o)}.out.none{background:#eceef2;color:#5a6170}.out.refer{background:var(--y2);color:var(--y)}
.lic{border-radius:24px;padding:22px;background:#fff;position:relative;box-shadow:0 10px 30px rgba(30,43,74,.12);border-top:10px solid var(--a)}
.lic .seal{position:absolute;right:18px;top:24px;width:70px;height:70px;border-radius:50%;border:2.5px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:800;font-size:13px;transform:rotate(-12deg);text-align:center;line-height:1.15}
.lic h2{font-size:22px;color:var(--c)}.lic .nm{font-size:30px;font-weight:800;margin:10px 0 0;letter-spacing:-.02em}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}td,th{border-bottom:1px solid var(--ln);padding:8px 4px;text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td:first-child,th:first-child{white-space:nowrap;padding-right:10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:linear-gradient(to top,rgba(238,242,248,1) 60%,rgba(238,242,248,0))}
.bar button{flex:1;max-width:420px;min-height:54px;font-size:17px}
.bar button.circ{flex:none;width:54px;padding:0;font-size:22px;border-radius:50%;background:#fff;color:var(--ink);border:1.5px solid var(--ln);box-shadow:0 2px 6px rgba(30,43,74,.06)}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
.chat{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:10px;margin:8px 0;background:#f5f7fb;border-radius:14px}
.me,.bt{max-width:86%;padding:8px 12px;border-radius:16px;font-size:14px}.me{align-self:flex-end;background:var(--a);color:#fff;border-bottom-right-radius:4px}.bt{align-self:flex-start;background:#fff;border:1px solid var(--ln);border-bottom-left-radius:4px}
form.row{display:flex;gap:8px}form.row button{white-space:nowrap;min-height:46px}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}.toast.on{opacity:1}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .4s}@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:scale(1);opacity:1}}}
.dq{font-weight:800;font-size:14px;margin-bottom:6px}
.st{display:flex;gap:8px;margin:7px 0;line-height:1.5}.st b{font-weight:800}.st>div>div{margin-top:2px}
.sn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--a2);color:var(--a);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.sb{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 3em;gap:8px;align-items:center;margin-top:4px;font-size:12px}.sb small{color:var(--mut)}.sb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb i{height:8px;background:#e3e8f1;border-radius:99px;overflow:hidden;display:block}.sb em{display:block;height:100%;background:var(--a3);border-radius:99px}.sb span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tok.dim{background:#f1f3f7;color:#a3aab6;font-weight:500}.dr{margin-top:6px;padding:8px 10px;background:#fff;border-radius:10px;border:1px solid var(--ln)}.dr small{color:var(--mut)}.dr>div{margin-top:3px}
details.data{margin-top:10px;background:#f5f7fb;border-radius:14px;padding:10px 14px}details.data summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--a);min-height:28px}.dd{padding:7px 0;border-top:1px solid var(--ln);font-size:14px}.dd:first-of-type{border-top:0}.dd small{color:var(--mut)}
.why0{font-size:13px;color:#4a5878;background:#fff;border-radius:10px;padding:8px 10px;margin:0 0 6px;border:1px solid var(--ln)}
.choice button.sel{border-color:var(--a);background:var(--a2);box-shadow:0 0 0 2px var(--a3)}.choice button.sel::before{content:'● ';color:var(--a)}
</style>

<body>
<div class="top"><div class="tr1"><div class="brand"><span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5" stroke="#f6b27f"/></svg></span><h1 id="ttl">챗봇 닥터 수련</h1></div><div class="meta"><div id="stl"></div><div class="pts" id="pts"></div></div></div><div class="prog"><i id="pg" style="width:0"></i></div></div>
<main id="main"></main>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== 챗봇 엔진 ===== */
const STRIP=['하면','해요','했어요','했어','하나요','할까','돼요','에서는','에서','에게','한테','까지','부터','으로','이랑','이에요','예요','인가요','나요','이야','야','요','은','는','을','를','이','가','도','로','에','의'];
function tokenize(s){return s.replace(/[?!.,~"“”'‘’()]/g,' ').split(/\s+/).filter(Boolean).map(w=>{for(const j of STRIP)if(w.length>j.length&&w.endsWith(j))return w.slice(0,-j.length);return w})}
function clone(o){return JSON.parse(JSON.stringify(o))}
/* bot: {mode:'rule'|'count'|'tf'|'tfidf', docs:[{id,t,tx,w:[..]}], rules:{id:[kw]}, syn:{a:b}, stop:[], thr:0} */
function respond(bot,q){
  const raw=q.q,tk0=q.tk||tokenize(raw),trace={tk:tk0,steps:[]};
  if(bot.mode==='rule'){
    for(const d of bot.docs)for(const k of(bot.rules[d.id]||[]))if(raw.includes(k)){trace.rule=`“${k}”가 있으면 → ${d.t}`;trace.rk=k;return{id:d.id,trace}}
    trace.rule='맞는 규칙 없음';return{id:null,trace}}
  const docs=bot.docs.map(d=>({id:d.id,w:d.w.filter(x=>!bot.stop.includes(x))})),V=new Set(docs.flatMap(d=>d.w)),N=docs.length,df={};
  V.forEach(w=>df[w]=docs.filter(d=>d.w.includes(w)).length);const idf=w=>Math.log2(N/df[w]);
  const tk=[];trace.map=[];
  tk0.forEach(w=>{if(bot.stop.includes(w)){trace.map.push([w,'s']);return}let x=w;if(!V.has(x)&&bot.syn[x]){trace.map.push([w,'m',bot.syn[x]]);x=bot.syn[x]}else trace.map.push([w,V.has(w)?'k':'u']);if(V.has(x))tk.push(x)});
  const uq=[...new Set(tk)];
  let sc;
  if(bot.mode==='count')sc=docs.map(d=>({id:d.id,s:uq.reduce((a,w)=>a+d.w.filter(y=>y===w).length,0),L:d.w.length}));
  else if(bot.mode==='tf')sc=docs.map(d=>({id:d.id,s:uq.reduce((a,w)=>a+d.w.filter(y=>y===w).length/d.w.length,0),L:d.w.length}));
  else{const qv={};tk.forEach(w=>qv[w]=(qv[w]||0)+1/tk.length);
    sc=docs.map(d=>{let dot=0,a=0,b=0;V.forEach(w=>{const x=(qv[w]||0)*idf(w),y=d.w.filter(z=>z===w).length/d.w.length*idf(w);dot+=x*y;a+=x*x;b+=y*y});return{id:d.id,s:a&&b?dot/Math.sqrt(a*b):0,L:d.w.length}})}
  trace.idf=Object.fromEntries(uq.map(w=>[w,idf(w)]));
  trace.sc=[...sc].sort((a,b)=>b.s-a.s);const top=trace.sc[0];
  const thr=bot.mode==='tfidf'?bot.thr:0;
  return{id:top&&top.s>0&&top.s>=thr?top.id:null,trace}}
function exam(bot,tests){return tests.map(t=>{const r=respond(bot,t);return{...t,got:r.id,ok:r.id===t.exp,trace:r.trace}})}
/* 처방 적용 */
function applyRx(bot,rx){const b=clone(bot);
  if(rx.tool==='search'){b.mode='tfidf'}
  else if(rx.tool==='len'){if(b.mode==='count')b.mode='tf'}
  else if(rx.tool==='idf'){if(b.mode==='tf'||b.mode==='count')b.mode='tfidf'}
  else if(rx.tool==='stop'){b.stop=[...b.stop,...rx.words]}
  else if(rx.tool==='syn'){rx.pairs.forEach(([a,c])=>b.syn[a]=c)}
  else if(rx.tool==='ex'){const d=b.docs.find(x=>x.id===rx.doc);if(d)d.w=[...d.w,...(rx.tk||tokenize(rx.text))]}
  else if(rx.tool==='thr'){b.thr=rx.v}
  else if(rx.tool==='rule'){(b.rules[rx.doc]=b.rules[rx.doc]||[]).push(rx.word)}
  return b}
function outcome(before,after){const pb=before.filter(x=>x.ok).length,pa=after.filter(x=>x.ok).length,broke=after.some((x,i)=>before[i].ok&&!x.ok);
  if(broke)return'side';if(pa===after.length)return'cure';if(pa>pb)return'better';return'none'}
/* ===== 환자 데이터 ===== */
const D=(id,t,tx,w)=>({id,t,tx,w:w.split(' ')});
const DX={norule:'이 질문에 맞는 규칙이 아예 없다',rule:'키워드가 들어 있기만 하면 그 답을 한다',len:'답변 문장이 길수록 점수를 더 받는다',common:'어디에나 있는 흔한 말이 점수를 가져간다',unk:'처음 보는 단어를 그냥 무시한다',order:'단어 순서가 바뀌어도 구별하지 못한다',ctx:'같은 단어의 다른 뜻을 구별하지 못한다',halluc:'모르는 질문에도 아무 답이나 한다'};
const TOOLS={search:'검색형(TF-IDF)으로 전환',rule:'규칙 추가',len:'길이로 나누기 (TF)',idf:'IDF 적용',stop:'불용어 지정',syn:'비슷한 말 연결',ex:'예시 질문 추가',thr:'기준선 설정',refer:'전문의 의뢰 (불치)'};
const EASY=[
{id:'e1',name:'빈칸봇',age:'1단계 규칙형',cc:'도서관을 물으면 늘 “잘 모르겠어요”라고 해요.',
 bot:{mode:'rule',rules:{meal:['급식'],nurse:['보건실']},syn:{},stop:[],thr:0,docs:[
  D('meal','급식','급식 메뉴는 홈페이지 식단표에 있어요.','급식 메뉴 홈페이지 식단표'),
  D('lib','도서관','도서관은 본관 3층이고 오후 5시까지 열어요.','도서관 본관 3층 오후 5시'),
  D('nurse','보건실','보건실은 1층이에요.','보건실 1층')]},
 tests:[{q:'도서관 몇 시까지 해?',tk:['도서관','몇','시'],exp:'lib'},{q:'급식 뭐야?',tk:['급식','뭐'],exp:'meal'},{q:'도서관 위치 알려 줘',tk:['도서관','위치','알려'],exp:'lib'},{q:'보건실 어디야?',tk:['보건실','어디'],exp:'nurse'}],
 dx:'norule',dxOpt:['norule','len','ctx','order'],
 sa:{q:'챗봇이 대답하지 못한 두 질문에 공통으로 들어 있는 단어는?',a:['도서관']},

  $('#main').innerHTML=`<div class="card"><div class="stage">${STG.map((x,i)=>`<span class="${i<si?'done':i===si?'on':''}">${x[1]}</span>`).join('')}</div>
  <div class="pt">${avatar(G.pi,s.stage==='end'&&['cure','refer'].includes(s.rx?.best)?'ok':s.rx?.tries?.some(t=>t.out==='side')&&s.stage!=='end'?'side':'sick')}<div><span class="lv">환자 ${G.pi+1} / ${PATIENTS.length}</span><h2>${esc(p.name)}</h2><div class="note" style="margin:0">${esc(p.age)}</div></div></div><div class="cc">보호자 호소: ${esc(p.cc)}</div>
  <details class="data" ${s.stage==='chart'?'open':''}><summary>이 챗봇이 가진 답변 데이터 (${p.bot.docs.length}개)</summary>${p.bot.docs.map(d=>`<div class="dd"><b>${esc(d.t)}</b>${p.bot.mode==='rule'?` <small>키워드: ${(p.bot.rules[d.id]||[]).join(', ')||'없음'}</small>`:` <small>단어 ${d.w.length}개</small>`}<div>${esc(d.tx)}</div></div>`).join('')}</details>
  <p class="note" style="margin-top:10px">아래 질문 칸을 누르면 검사 결과지(원리 보기)가 나와요.</p>${tilesHtml(before,'t4')}<div class="det" id="pdet">✗ 칸을 눌러 검사해 보세요.</div></div><div class="card" id="stg"></div><div id="hw"></div>`;
  bindTiles($('#main'),before,p.bot,title,'pdet',1);
  const el=$('#stg'),go=st=>{s.stage=st;startStage();render()};
  const answered={dx:!!G.tq['dx_'+p.id],rx:!!s.rx?.final}[s.stage];
  if(['dx','rx'].includes(s.stage)&&!answered){$('#hw').innerHTML=hintCard(p,s,s.stage);bindHint(p,s,s.stage)}
  if(s.stage==='chart'){el.innerHTML=`<h3>진료 시작</h3><p class="lead" style="margin:0">① 위의 답변 데이터를 읽고 ② ✗ 칸을 눌러 왜 틀렸는지 살펴본 뒤 진단해요. 진단 15점 · 처방 30점.</p><p class="note" style="margin-top:8px">모든 환자를 고칠 수 있지는 않아요. 이 병원의 도구(1부 Lv1~Lv3)로 안 고쳐지는 병은 <b>‘전문의 의뢰’가 정답</b>이에요.</p>`;
    nav(G.pi>0?()=>{G.pi--;render()}:null,'진단하기 →',true,()=>go('dx'))}
  else if(s.stage==='dx'){const opts=[p.dx,...p.dxOpt.filter(x=>x!==p.dx)].map(k=>DX[k]);
    quiz(el,'dx_'+p.id,`${esc(p.name)}에게 무슨 일이 일어났을까요?`,opts,10,()=>{s.dx={pts:G.tq['dx_'+p.id].pts};save();const b=$('#nx');if(b)b.disabled=false;$('#hw').innerHTML=''},p.dxWhy);
    const q=G.tq['dx_'+p.id];if(q){s.dx={pts:q.pts}}nav(null,'처방하기 →',!!q,()=>go('rx'))}
  else if(s.stage==='rx')Rx(p,s,el,before,title);
  else{const pts=pPts(s),stc=stars(pts),pen=Object.values(s.pen||{}).reduce((a,b)=>a+b,0);el.innerHTML=`<h3>진료 소견</h3><div style="font-size:26px;color:var(--y);letter-spacing:2px">${'★'.repeat(stc)}${'☆'.repeat(3-stc)}</div>
    <table><tr><td>진단</td><td class="n">${s.dx?.pts||0} / 15</td></tr><tr><td>처방 (${OUTL[s.rx.best]}${s.rx.tries.length>1?', 재처방 −5':''})</td><td class="n">${s.rx.pts} / 30</td></tr>${pen?`<tr><td>힌트 사용</td><td class="n">−${pen}</td></tr>`:''}<tr><th>합계</th><th class="n">${pts} / ${MAX_P}</th></tr></table>
    <div class="fb" style="background:var(--g2);color:#17603f"><b>정답 처방</b>${esc(p.rx2)}</div><div class="fb ok" style="background:var(--a2);color:var(--ink)"><b>지도 교수 한마디</b>${esc(p.lesson)}</div>`;
    const last=G.pi===PATIENTS.length-1;nav(()=>{s.stage='rx';render()},last?'면허증 받기 →':'다음 환자 →',true,()=>{if(last){G.phase='license'}else{G.pi++;G.t0=null}render()})}}
const RXTOOLS=['rule','search','len','idf','syn','ex','refer'];
function chips(name,items){return`<div class="pick" data-g="${name}">${items.map(([v,l])=>`<button class="opt" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div>`}
const pickv=n=>{const b=document.querySelector(`[data-g="${n}"] [aria-pressed=true]`);return b?b.dataset.v:null};
function Rx(p,s,el,before,title){s.rx=s.rx||{tries:[]};const R=s.rx,done=R.final;
  const FN=['뭐','어디','어디서','몇','알려','어떻게','나오','얼마나','시','층','못','가'],V=[...new Set(p.bot.docs.flatMap(d=>d.w))],unk=[...new Set(before.filter(r=>!r.ok).flatMap(r=>(r.trace.map||[]).filter(m=>m[1]==='u'&&!FN.includes(m[0])).map(m=>m[0])))],qw=[...new Set(p.tests.flatMap(t=>t.tk||tokenize(t.q)))];
  const docs=p.bot.docs.map(d=>[d.id,d.t]);
  const PARAM={rule:`<label class="f">어느 답변에</label>${chips('d',docs)}<label class="f">어떤 키워드로</label>${chips('w',qw.map(w=>[w,w]))}`,
   syn:`<label class="f">처음 보는 말</label>${chips('a',(unk.length?unk:qw).map(w=>[w,w]))}<label class="f">→ 이렇게 읽기 (아는 말)</label>${chips('b',V.map(w=>[w,w]))}`,
   ex:`<label class="f">어느 답변에</label>${chips('d',docs)}<label class="f">어떤 예시 질문을 붙일까</label>${chips('q',p.tests.map((t,i)=>[i,t.q]))}`};
  const FBK={cure:'모든 질문을 맞혀요. 완치!',better:'일부는 고쳐졌지만 아직 ✗ 칸이 남았어요.',side:'고친 곳도 있지만, 멀쩡하던 질문이 새로 틀렸어요(빨간 칸). 칸을 눌러 이유를 보세요.',none:'증상이 그대로예요. 이 도구로는 원인이 안 바뀌어요.',refer:p.curable?'이 병원에서 고칠 수 있는 환자였어요.':'정확한 판정! 이 병원의 도구로는 못 고쳐요.'};
  const tried=R.tries.map((t,i)=>`<div class="row2" style="margin-top:10px">${i+1}차 처방: <b>${esc(TOOLS[t.rx.tool])}</b> → <span class="out ${t.out}">${OUTL[t.out]}</span></div><div class="note" style="margin-top:2px">${FBK[t.out]}</div>${t.out!=='refer'?`<div data-try="${i}">${tilesHtml(t.res,'t4')}</div><div class="det" id="rdet${i}" style="display:none"></div>`:''}`).join('');
  const bindTried=()=>R.tries.forEach((t,i)=>{const box=document.querySelector(`[data-try="${i}"]`);if(!box)return;const nb=applyRx(p.bot,t.rx);box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{box.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed',x===b));const d=$('#rdet'+i);d.style.display='block';d.innerHTML=detail(exam(nb,p.tests)[+b.dataset.i],nb,title,1)})});
  if(done){el.innerHTML=`<h3>처방 결과</h3>${tried}`;bindTried();nav(null,'소견 보기 →',true,()=>{s.stage='end';render()});return}
  const canRetry=R.tries.length===1;
  el.innerHTML=`<h3>처방 · 30점</h3>${tried}${R.tries.length?`<p class="lead" style="margin-top:10px">한 번 더 처방할 수 있어요 (−5점). 아니면 이대로 마쳐도 돼요.</p>`:timer(LIM.rx)}
  <label class="f">치료 도구 고르기</label><div class="pick" id="tl">${RXTOOLS.map(k=>{const on=(p.bot.mode==='tfidf'&&['search','len','idf'].includes(k))||(p.bot.mode==='tf'&&k==='len');return`<button class="opt" data-k="${k}" ${on?'disabled title="이미 적용됨"':''}>${TOOLS[k]} <small style="opacity:.65;font-weight:500">${on?'이미 적용됨':TAG[k]}</small></button>`}).join('')}</div>
  <div id="pp"></div><div class="row" style="display:flex;gap:8px;margin-top:12px" data-x="1"><button id="go" disabled>처방하고 재검사</button>${canRetry?'<button class="ghost" id="fin">이대로 마치기</button>':''}</div>`;
  bindTried();$('#bar').innerHTML='';let tool=null;
  el.onclick=e=>{const g=e.target.closest('[data-g] button');if(g){g.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===g))}};
  $('#tl').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.k;$('#tl').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#pp').innerHTML=PARAM[tool]||'';$('#go').disabled=false};
  const finish=()=>{const best=R.tries.reduce((a,t)=>OUTP2(t.out,p)>OUTP2(a.out,p)?t:a,R.tries[0]);R.best=best.out;
    R.pts=Math.max(0,OUTP2(best.out,p)-(R.tries.length>1?5:0)+(R.intime?5:0));R.final=1;save();frame();Ward()};
  if($('#fin'))$('#fin').onclick=finish;
  $('#go').onclick=()=>{let rx={tool};
    if(tool==='rule'){const d=pickv('d'),w=pickv('w');if(!d||!w)return toast('답변과 키워드를 고르세요');rx={tool,doc:d,word:w}}
    if(tool==='syn'){const a=pickv('a'),b=pickv('b');if(!a||!b)return toast('두 단어를 고르세요');rx={tool,pairs:[[a,b]]}}
    if(tool==='ex'){const d=pickv('d'),q=pickv('q');if(!d||q===null)return toast('답변과 예시 질문을 고르세요');const t=p.tests[+q];rx={tool,doc:d,text:t.q,tk:t.tk}}
    if(!R.tries.length)R.intime=inTime(LIM.rx);
    let out,res=[];if(tool==='refer'){out='refer'}else{res=exam(applyRx(p.bot,rx),p.tests);out=outcome(before,res)}
    R.tries.push({rx,out,res});save();toast(OUTL[out]);
    if(out==='cure'||out==='refer'||R.tries.length>=2)finish();else Ward()}}
function shuf(a){return a.map((_,i)=>i).sort((x,y)=>((x*5+a[0].length)%3)-((y*5+a[0].length)%3))}
function OUTP2(out,p){if(out==='refer')return p.curable?0:25;return OUTP[out]||0}
/* ===== 수료 ===== */
function License(){const t=total(),pc=t/MAXALL,grade=pc>=.85?'전문의':pc>=.6?'레지던트':'인턴',tp=Object.entries(G.tq).filter(([k])=>/^t\d/.test(k)).reduce((a,[,q])=>a+q.pts,0);
  $('#main').innerHTML=`<div class="lic"><div class="seal">고우봇<br>종합병원</div><div class="lv">챗봇 닥터 면허증</div><div class="nm">${esc(DN())}</div><h2>${grade}</h2><p class="lead">${t} / ${MAXALL}점 · 내 챗봇 ${esc(BN())}</p>
  <table><tr><td>1부 수련</td><td></td><td class="n">${tp} / ${MAX_T}</td></tr>${PATIENTS.map(p=>{const s=G.ps[p.id]||{},n=pPts(s);return`<tr><td>${esc(p.name)}</td><td style="color:var(--y)">${s.stage==='end'?'★'.repeat(stars(n))+'☆'.repeat(3-stars(n)):'-'}${s.rx?` <span class="note">${OUTL[s.rx.best]||''}</span>`:''}</td><td class="n">${n} / ${MAX_P}</td></tr>`}).join('')}</table>
  <p class="note">전문의 85% 이상 · 레지던트 60% 이상 · 인턴</p></div>`;
  nav(()=>{G.phase='ward';G.pi=PATIENTS.length-1;render()},'처음부터 다시',true,()=>{G=fresh();render()})}
render();
}
</script>
</body>
